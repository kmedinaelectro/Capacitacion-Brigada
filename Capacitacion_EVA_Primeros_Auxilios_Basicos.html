<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA · Primeros Auxilios Básicos · Brigada ElectroPlast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F5;
    --paper:#FFFFFF;
    --ink:#1C2522;
    --ink-soft:#54615C;
    --line:#DDE3E0;
    --blue:#1B4B66;
    --blue-deep:#123244;
    --red:#B93A2E;
    --amber:#D99A2E;
    --green:#2E8B57;
    --green-bg:#E8F4EC;
    --amber-bg:#FBF1DD;
    --red-bg:#F8E7E4;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--blue-deep);
  }
  .mono{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.02em;
  }

  /* ===== HEADER ===== */
  header.top{
    background:var(--blue-deep);
    color:#fff;
    padding:22px 20px 0 20px;
    position:relative;
    overflow:hidden;
  }
  .top-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    position:relative;
    z-index:2;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#8FB4C6;
    margin:0 0 4px 0;
  }
  header.top h1{
    color:#fff;
    font-size:clamp(28px,5vw,42px);
    margin:0;
    line-height:0.95;
  }
  header.top .sub{
    color:#C7D9E1;
    font-size:15px;
    margin-top:6px;
    max-width:520px;
  }
  .ekg-wrap{
    height:46px;
    margin-top:14px;
    position:relative;
  }
  .ekg-wrap svg{width:100%;height:100%;display:block;}
  .ekg-line{
    fill:none;
    stroke:#4FA3C4;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:900;
    stroke-dashoffset:900;
    animation:draw 4.5s linear infinite;
  }
  @keyframes draw{
    0%{stroke-dashoffset:900;}
    60%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:-900;}
  }
  .progress-shell{
    max-width:1100px;
    margin:16px auto 0 auto;
    padding:0 20px 18px 20px;
    position:relative;
    z-index:2;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:rgba(255,255,255,0.15);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,#4FA3C4,#7FD1A3);
    border-radius:6px;
    transition:width .4s ease;
    width:0%;
  }
  .progress-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#C7D9E1;
    white-space:nowrap;
  }

  /* ===== LAYOUT ===== */
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:24px 20px 80px 20px;
    display:grid;
    grid-template-columns:260px 1fr;
    gap:24px;
    align-items:start;
  }
  @media(max-width:840px){
    .wrap{grid-template-columns:1fr; padding-top:16px;}
  }

  /* ===== STEPPER ===== */
  nav.stepper{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px;
    position:sticky;
    top:16px;
  }
  @media(max-width:840px){
    nav.stepper{position:static; display:flex; overflow-x:auto; gap:6px; padding:10px 6px;}
  }
  .step-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:10px 10px;
    border-radius:10px;
    border:none;
    background:transparent;
    cursor:pointer;
    text-align:left;
    font-family:'Source Sans 3',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    transition:background .15s ease;
  }
  @media(max-width:840px){
    .step-item{flex-direction:column; align-items:center; min-width:84px; text-align:center; font-size:11.5px; gap:4px;}
  }
  .step-item:hover{background:#F0F3F2;}
  .step-item.active{background:var(--blue); color:#fff;}
  .step-item.active .step-num{background:#fff; color:var(--blue);}
  .step-num{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    background:#E4E9E7;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;font-weight:600;
  }
  .step-num.done{background:var(--green); color:#fff;}
  .step-item.active .step-num.done{background:#fff; color:var(--green);}
  .step-title{flex:1; line-height:1.15;}

  /* ===== MAIN PANEL ===== */
  main.panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:clamp(20px,4vw,36px);
    min-height:400px;
  }
  .module-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:0.14em;
    margin:0 0 4px 0;
  }
  main.panel h2{
    font-size:clamp(26px,4vw,36px);
    margin:0 0 6px 0;
    color:var(--blue-deep);
  }
  .objective{
    color:var(--ink-soft);
    font-size:15px;
    max-width:640px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
    background:#FBFCFC;
  }
  .card h3{
    font-size:19px;
    margin:0 0 8px 0;
    color:var(--blue);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card ul{margin:6px 0 0 0; padding-left:20px;}
  .card li{margin-bottom:5px; line-height:1.45; font-size:14.5px;}
  .card p{line-height:1.5; font-size:14.5px; margin:6px 0;}
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:2px 8px;
    border-radius:20px;
    background:var(--amber-bg);
    color:#8A5E10;
    margin-right:6px;
  }
  .tag.red{background:var(--red-bg); color:var(--red);}
  .tag.green{background:var(--green-bg); color:var(--green);}
  .mini-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:13.5px;}
  .mini-table th, .mini-table td{border:1px solid var(--line); padding:6px 8px; text-align:left;}
  .mini-table th{background:#EEF2F1; font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase;}

  /* ===== QUIZ ===== */
  .quiz-box{
    margin-top:26px;
    padding-top:22px;
    border-top:2px dashed var(--line);
  }
  .quiz-box h3{
    font-size:22px; color:var(--blue-deep); margin-bottom:2px;
  }
  .quiz-sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:16px;}
  .q-block{margin-bottom:18px;}
  .q-text{font-weight:600; margin-bottom:8px; font-size:15px;}
  .q-opt{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    font-size:14px;
    transition:background .12s ease, border-color .12s ease;
  }
  .q-opt:hover{background:#F0F3F2;}
  .q-opt input{margin-top:2px;}
  .q-opt.correct{border-color:var(--green); background:var(--green-bg);}
  .q-opt.wrong{border-color:var(--red); background:var(--red-bg);}
  .btn{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:15px;
    padding:11px 22px;
    border-radius:8px;
    border:none;
    background:var(--blue);
    color:#fff;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--blue-deep);}
  .btn:disabled{background:#B9C2BF; cursor:not-allowed;}
  .btn.secondary{background:transparent; color:var(--blue); border:1.5px solid var(--blue);}
  .btn.secondary:hover{background:#EAF1F4;}
  .result-banner{
    margin-top:16px;
    padding:14px 16px;
    border-radius:10px;
    font-size:14.5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .result-banner.pass{background:var(--green-bg); color:#1E5C39; border:1px solid #BFE1CC;}
  .result-banner.fail{background:var(--red-bg); color:#8C2A20; border:1px solid #E9C1BA;}
  .result-score{font-family:'IBM Plex Mono',monospace; font-weight:600;}

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    margin-top:28px;
    gap:10px;
    flex-wrap:wrap;
  }

  /* ===== CERTIFICATE ===== */
  .cert-form{max-width:420px;}
  .cert-form label{font-size:13.5px; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .cert-form input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    margin-bottom:16px;
    font-family:'Source Sans 3',sans-serif;
  }
  .certificate{
    border:3px solid var(--blue-deep);
    border-radius:16px;
    padding:clamp(24px,5vw,50px);
    text-align:center;
    background:
      radial-gradient(circle at top left, #EAF1F4 0, transparent 55%),
      radial-gradient(circle at bottom right, #E8F4EC 0, transparent 55%),
      #fff;
    margin-top:24px;
  }
  
  .certificate .logo-wrap{margin-bottom:10px;}
  .certificate .logo-wrap img{height:52px; width:auto;}
  .certificate .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.2em; color:var(--blue); text-transform:uppercase;}
  .certificate h2{font-size:clamp(28px,5vw,42px); margin:8px 0 4px 0;}
  .certificate .name{
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(26px,4.5vw,34px);
    font-weight:700;
    color:var(--blue-deep);
    border-bottom:2px solid var(--amber);
    display:inline-block;
    padding:2px 18px 6px 18px;
    margin:14px 0;
    text-transform:none;
  }
  .certificate .desc{max-width:520px; margin:0 auto; color:var(--ink-soft); font-size:14.5px; line-height:1.5;}
  .cert-meta{
    display:flex; justify-content:center; gap:40px; margin-top:26px; flex-wrap:wrap;
  }
  .cert-meta div{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .cert-meta strong{display:block; color:var(--ink); font-size:14px; font-family:'Source Sans 3',sans-serif; margin-top:2px;}
  .print-hide{margin-top:26px;}
  @media print{
    header.top, nav.stepper, .nav-buttons, .print-hide, .module-eyebrow, .objective{display:none !important;}
    body{background:#fff;}
    .wrap{grid-template-columns:1fr; padding:0;}
    main.panel{border:none; padding:0;}
  }

  .lock-note{
    margin-top:16px;
    padding:12px 14px;
    background:var(--amber-bg);
    border:1px solid #EBD6A3;
    border-radius:10px;
    font-size:13.5px;
    color:#7A5610;
  }
  footer.foot{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    padding:20px;
    font-family:'IBM Plex Mono',monospace;
  }
  .back-link{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#8FB4C6; text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-bottom:10px;}
  .back-link:hover{color:#fff;}
</style>
</head>

  <div class="top-inner">
    <div>

  <div class="ekg-wrap">

      <path class="ekg-line" d="M0,23 L60,23 L75,23 L85,6 L95,40 L105,14 L115,23 L180,23 L195,23 L205,10 L215,34 L225,18 L235,23 L300,23 L315,23 L325,6 L335,40 L345,14 L355,23 L420,23 L435,23 L445,10 L455,34 L465,18 L475,23 L540,23 L555,23 L565,6 L575,40 L585,14 L600,23"/>

<script>
/* ============================================================
   CONTENIDO DE MÓDULOS
   ============================================================ */
const modules = [
{
  id:1, title:"El Primer Respondedor",
  objective:"Comprender el rol, las responsabilidades legales y los derechos del paciente que enmarcan la actuación de un brigadista.",
  sections:[
    {h:"¿Quién es el primer respondedor?", body:[
      "Persona capacitada en primeros auxilios básicos que acude a ayudar a alguien con una alteración de salud o integridad física, mientras llega el Sistema de Emergencias Médicas (SEM).",
      "Sus tareas: identificar la emergencia, llamar al 911, evaluar la escena y al lesionado, brindar los primeros auxilios y el manejo inicial, y acompañar a la víctima hasta que llegue ayuda especializada."
    ]},
    {h:"Prioridades del brigadista", list:[
      "Preservar su propia integridad física.",
      "Preservar la vida de la víctima.",
      "Evitar que se agraven las lesiones.",
      "Promover la recuperación y evitar complicaciones físicas y psicológicas.",
      "Asegurar el traslado a un centro médico."
    ]},
    {h:"Responsabilidades y faltas a evitar", body:["El rol conlleva empatía, deber de auxilio, respeto, igualdad y entrenamiento continuo. Debe evitarse:"], list:[
      "Imprudencia — actuar con apresuramiento sin tomar precauciones.",
      "Impericia — falta de conocimientos técnicos.",
      "Negligencia — incumplir los deberes elementales del rol.",
      "Abandono — retirarse sin entregar al paciente a alguien de igual o mayor capacitación."
    ]},
    {h:"Derechos del paciente", list:[
      "Consentimiento informado: comunicación continua que respeta la decisión del paciente sobre cualquier procedimiento no invasivo.",
      "Consentimiento explícito: el paciente consciente y orientado autoriza la atención, tras saber que usted es brigadista.",
      "Consentimiento implícito: aplica cuando el paciente está inconsciente o no puede decidir; se asume que aceptaría la ayuda.",
      "Derecho a rehusar: todo adulto consciente y orientado puede rechazar la atención.",
      "Confidencialidad: lo tratado con el paciente es secreto profesional."
    ]},
    {h:"Marco legal en Costa Rica", body:["El Código Penal costarricense contempla delitos relacionados con la actuación del primer respondiente:"], list:[
      "Abandono de incapaces","Omisión de auxilio","Lesiones culposas","Lesiones leves","Mala praxis"
    ]}
  ],
  quiz:[
    {q:"¿Cuál NO es una prioridad del primer respondedor?",opts:["Preservar su propia integridad física","Diagnosticar la enfermedad de fondo del paciente","Evitar que se agraven las lesiones","Asegurar el traslado a un hospital"],correct:1},
    {q:"Retirarse del lugar sin entregar al paciente a otra persona igual o mejor capacitada se considera:",opts:["Impericia","Imprudencia","Abandono","Negligencia"],correct:2},
    {q:"¿Qué tipo de consentimiento aplica cuando la víctima está inconsciente?",opts:["Consentimiento explícito","Consentimiento implícito","Consentimiento informado escrito","Ninguno, no se puede actuar"],correct:1},
    {q:"Un adulto consciente y orientado tiene derecho a:",opts:["Ser atendido obligatoriamente","Rehusar la atención de primeros auxilios","Elegir el hospital de destino","Firmar un documento antes de recibir ayuda"],correct:1}
  ]
},
{
  id:2, title:"Evaluación de la Escena",
  objective:"Aplicar la técnica de las 3S y las precauciones universales antes de acercarse a la víctima.",
  sections:[
    {h:"Técnica de las 3S", list:[
      "Seguridad: identificar todo lo que ponga en peligro al rescatador y al paciente.",
      "eScena: conocer cuántos vehículos o elementos están involucrados y el grado de daño.",
      "Situación: preguntarse qué ocurrió, cuál es el mecanismo de lesión, cuántas personas están involucradas y qué recursos se necesitan."
    ]},
    {h:"Precauciones universales y EPP", body:[
      "Se debe evitar el contacto directo con sangre, saliva, vómito, orina o heces del paciente.",
      "El equipo de protección personal (guantes, mascarilla, lentes, bata) protege frente a enfermedades contagiosas y es parte de las precauciones estándar, junto con el lavado de manos."
    ]}
  ],
  quiz:[
    {q:"La letra “S” de Situación, dentro de la técnica 3S, busca responder principalmente:",opts:["Cuál es el color del vehículo","Qué ocurrió y qué recursos se necesitan","Quién tiene la razón del accidente","Cuánto cuesta el rescate"],correct:1},
    {q:"Las precauciones universales buscan proteger frente a:",opts:["El clima","El contacto con fluidos corporales","La luz solar","El ruido ambiental"],correct:1},
    {q:"Antes de acercarse a la víctima, la prioridad del brigadista es:",opts:["La rapidez ante todo","Su propia seguridad","Llamar a la familia","Fotografiar la escena"],correct:1}
  ]
},
{
  id:3, title:"Abordaje del Paciente",
  objective:"Aplicar la secuencia XABCDE, la revisión secundaria y la toma de signos vitales e historial SAMPLE.",
  sections:[
    {h:"Secuencia general de abordaje", list:[
      "Asegurar la escena","Activar el SEM","Identificar el tipo de paciente (médico o trauma)","Revisión primaria","Revisión secundaria","Toma de signos vitales","Entrevista (historial)","Entrega del paciente al SEM"
    ]},
    {h:"Revisión primaria — mnemónico XABCDE", body:["Cada paso tiene un tiempo máximo orientativo de 10 segundos, salvo el control de hemorragias que se atiende de inmediato:"], list:[
      "X — Control de hemorragias severas: presión directa, empaquetamiento o torniquete.",
      "A — Vía aérea: elevación de mentón (paciente médico) o tracción mandibular con inmovilización cervical (paciente trauma).",
      "B — Respiración: técnica VOS — Ver el tórax, Oír la respiración, Sentir el aire.",
      "C — Circulación: pulso carotídeo, llenado capilar, temperatura y control de hemorragias.",
      "D — Estado neurológico: nivel de conciencia con el método ADVI (Alerta, Verbal, Doloroso, Inconsciente).",
      "E — Exposición: revisar el cuerpo completo cuidando el pudor, y luego cubrir para conservar el calor."
    ]},
    {h:"Orden según el tipo de paciente", body:[
      "Paciente médico: A-B-C-D-E.",
      "Paciente trauma: X-A-B-C-D-E.",
      "Paciente en paro cardiorrespiratorio: C-A-B."
    ]},
    {h:"Revisión secundaria: ver, oír y sentir", body:["Se recorre el cuerpo de cabeza a extremidades buscando hemorragias, deformidades, sonidos anormales y sensibilidad, sin limitarse a mirar de forma superficial."]},
    {h:"Signos vitales", body:["El conjunto completo incluye presión arterial, frecuencia cardiaca, frecuencia respiratoria, saturación de oxígeno, temperatura corporal, llenado capilar, reflejo pupilar y color de piel. En un paciente crítico se reevalúan cada 3 a 5 minutos."], table:{
      head:["Parámetro","Valor de referencia (adulto)"],
      rows:[
        ["Frecuencia cardiaca","60–100 lpm en reposo"],
        ["Frecuencia respiratoria","15–20 resp/min"],
        ["Saturación de oxígeno","Normosaturación &gt;95%"],
        ["Temperatura corporal","36–37.5 °C (normal)"],
        ["Presión arterial normal","Menor a 120/80 mmHg"]
      ]
    }},
    {h:"Historial SAMPLE y dolor ALICIA", list:[
      "SAMPLE: Síntomas, Alergias, Medicamentos, Pasado médico, Última comida/periodo, Eventos previos.",
      "ALICIA (para evaluar dolor): Aparición, Localización, Intensidad, Características, Irradiación, Alivio."
    ]}
  ],
  quiz:[
    {q:"En el paciente de trauma, la secuencia de revisión primaria inicia con:",opts:["A de vía aérea","X de control de hemorragias","C de circulación","D de estado neurológico"],correct:1},
    {q:"La técnica VOS se utiliza para evaluar:",opts:["El pulso","La respiración","El estado de conciencia","La temperatura"],correct:1},
    {q:"El método ADVI mide:",opts:["El nivel de conciencia","La presión arterial","El tipo de fractura","La saturación de oxígeno"],correct:0},
    {q:"En la nemotecnia SAMPLE, la letra “M” corresponde a:",opts:["Movimiento","Medicamentos","Mecanismo de lesión","Masa corporal"],correct:1},
    {q:"Una saturación de oxígeno mayor a 95% se clasifica como:",opts:["Desaturación grave","Desaturación moderada","Normosaturación","Desaturación leve"],correct:2}
  ]

/* ============================================================
   RENDER: STEPPER
   ============================================================ */
function renderStepper(){
  const nav = document.getElementById('stepper');
  nav.innerHTML = "";
  modules.forEach(m=>{
    const st = state.moduleStatus[m.id];
    const btn = document.createElement('button');
    btn.className = 'step-item' + (state.currentView === 'm'+m.id ? ' active':'');
    btn.innerHTML = `<span class="step-num ${st.done?'done':''}">${st.done?'✓':m.id}</span><span class="step-title">${m.title}</span>`;
    btn.onclick = ()=>{ state.currentView = 'm'+m.id; renderAll(); };
    nav.appendChild(btn);
  });
  const allDone = modules.every(m=>state.moduleStatus[m.id].done);
  const examBtn = document.createElement('button');
  examBtn.className = 'step-item' + (state.currentView==='final' ? ' active':'');
  examBtn.innerHTML = `<span class="step-num ${state.finalStatus.done?'done':''}">${state.finalStatus.done?'✓':'E'}</span><span class="step-title">Evaluación final</span>`;
  examBtn.onclick = ()=>{ state.currentView='final'; renderAll(); };
  nav.appendChild(examBtn);

  const certBtn = document.createElement('button');
  certBtn.className = 'step-item' + (state.currentView==='cert' ? ' active':'');
  certBtn.innerHTML = `<span class="step-num">🎓</span><span class="step-title">Certificado</span>`;
  certBtn.onclick = ()=>{ state.currentView='cert'; renderAll(); };
  nav.appendChild(certBtn);
}

/* ============================================================
   RENDER: PROGRESS BAR
   ============================================================ */
function renderProgress(){
  const total = modules.length + 1;
  const done = modules.filter(m=>state.moduleStatus[m.id].done).length + (state.finalStatus.done?1:0);
  const pct = Math.round((done/total)*100);
  document.getElementById('progressFill').style.width = pct + "%";
  document.getElementById('progressLabel').textContent = `${done} / ${total} completados · ${pct}%`;
}

/* ============================================================
   RENDER: CONTENT SECTIONS
   ============================================================ */
function sectionHTML(s){
  let html = `<div class="card"><h3>${s.h}</h3>`;
  if(s.body){ s.body.forEach(p=> html += `<p>${p}</p>`); }
  if(s.list){ html += "<ul>" + s.list.map(li=>`<li>${li}</li>`).join("") + "</ul>"; }
  if(s.table){
    html += `<table class="mini-table"><thead><tr>${s.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`;
    s.table.rows.forEach(r=> html += `<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`);
    html += "</tbody></table>";
  }
  html += "</div>";
  return html;
}

/* ============================================================
   RENDER: QUIZ (module or final)
   ============================================================ */
function quizHTML(questions, prefix){
  let html = `<div class="quiz-box"><h3>Autoevaluación</h3><p class="quiz-sub">Selecciona una respuesta por pregunta y presiona "Calificar".</p>`;
  questions.forEach((q,i)=>{
    html += `<div class="q-block" data-qidx="${i}"><p class="q-text">${i+1}. ${q.q}</p>`;
    q.opts.forEach((opt,j)=>{
      html += `<label class="q-opt" id="${prefix}-opt-${i}-${j}">
        <input type="radio" name="${prefix}-q${i}" value="${j}"> <span>${opt}</span>
      </label>`;
    });
    html += `</div>`;
  });
  html += `<button class="btn" id="${prefix}-gradeBtn">Calificar</button>
  <div id="${prefix}-resultBanner"></div></div>`;
  return html;
}

function gradeQuiz(questions, prefix, onGraded){
  let correctCount = 0;
  let allAnswered = true;
  questions.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="${prefix}-q${i}"]:checked`);
    if(!sel){ allAnswered = false; return; }
    const chosen = parseInt(sel.value);
    q.opts.forEach((opt,j)=>{
      const el = document.getElementById(`${prefix}-opt-${i}-${j}`);
      el.classList.remove('correct','wrong');
      if(j === q.correct) el.classList.add('correct');
      else if(j === chosen) el.classList.add('wrong');
    });
    if(chosen === q.correct) correctCount++;
  });
  if(!allAnswered){
    document.getElementById(`${prefix}-resultBanner`).innerHTML =
      `<div class="result-banner fail">⚠️ Responde todas las preguntas antes de calificar.</div>`;
    return;
  }
  const pct = Math.round((correctCount/questions.length)*100);
  const passed = pct >= 70;
  document.getElementById(`${prefix}-resultBanner`).innerHTML =
    `<div class="result-banner ${passed?'pass':'fail'}">
      <span>${passed ? '✅ ¡Aprobado! Puedes continuar al siguiente módulo.' : '❌ Aún no alcanzas el 70% necesario. Revisa el contenido e inténtalo de nuevo.'}</span>
      <span class="result-score">${correctCount}/${questions.length} · ${pct}%</span>
    </div>`;
  onGraded(passed, pct);
}

/* ============================================================
   RENDER: MODULE VIEW
   ============================================================ */
function renderModuleView(m){
  const panel = document.getElementById('panel');
  let html = `<p class="module-eyebrow">Módulo ${m.id} de ${modules.length}</p>
  <h2>${m.title}</h2>
  <p class="objective"><strong>Objetivo:</strong> ${m.objective}</p>`;
  m.sections.forEach(s => html += sectionHTML(s));
  html += quizHTML(m.quiz, 'm'+m.id);

  const idx = modules.findIndex(x=>x.id===m.id);
  const prevM = modules[idx-1];
  const nextM = modules[idx+1];
  html += `<div class="nav-buttons">
    <button class="btn secondary" id="prevBtn" ${prevM?'':'disabled'}>← ${prevM ? prevM.title : 'Inicio'}</button>
    <button class="btn secondary" id="nextBtn">${nextM ? nextM.title + ' →' : 'Ir a Evaluación final →'}</button>
  </div>`;

  panel.innerHTML = html;

  document.getElementById('m'+m.id+'-gradeBtn').onclick = ()=>{
    gradeQuiz(m.quiz, 'm'+m.id, (passed, pct)=>{
      if(passed){
        state.moduleStatus[m.id] = {done:true, score:pct};
        renderStepper(); renderProgress();
      }
    });
  };
  if(prevM) document.getElementById('prevBtn').onclick = ()=>{ state.currentView='m'+prevM.id; renderAll(); };
  document.getElementById('nextBtn').onclick = ()=>{
    state.currentView = nextM ? 'm'+nextM.id : 'final';
    renderAll();
  };
}

function renderAll(){
  renderStepper();
  renderProgress();
  if(state.currentView === 'final'){ renderFinalView(); }
  else if(state.currentView === 'cert'){ renderCertView(); }
  else {
    const id = parseInt(state.currentView.replace('m',''));
    const m = modules.find(x=>x.id===id);
    renderModuleView(m);
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function generarResumenCert(nombre, score){

    return;
  }
  const area = document.getElementById('regArea').value.trim();
  const grupo = document.getElementById('regGrupo').value.trim();
  const instructor = document.getElementById('regInstructor').value.trim();
  const practica = document.getElementById('regPractica').value;
  const fecha = new Date().toISOString().slice(0,10);
  const tipo = 'Primeros Auxilios Básicos (EVA)';
  const modalidad = 'Video Autoestudio';
  const asistencia = '1';
  const resultado = score >= 80 ? 'APROBADO' : 'REPROBADO';
  const obs = 'Completado en módulo digital autoevaluado (EVA) el ' + fecha;
  const row = [nombre, area, grupo, tipo, fecha, modalidad, instructor, asistencia, score, resultado, practica, obs].join('\t');
  document.getElementById('resumenText').value = row;
  document.getElementById('resumenOutput').style.display = 'block';
  document.getElementById('resumenOutput').scrollIntoView({behavior:'smooth', block:'center'});
}
function copiarResumenCert(){
  const el = document.getElementById('resumenText');
  el.focus(); el.select(); el.setSelectionRange(0, 99999);
  const msg = document.getElementById('copyMsg');
  try{
    document.execCommand('copy');
    msg.textContent = '✓ Copiado — pégalo en CAP_MENSUAL';
  }catch(e){
    msg.textContent = 'Selecciona el texto y usa Ctrl+C';
  }
  setTimeout(()=>{ msg.textContent=''; }, 4000);
}
function enviarWhatsAppCert(){
  const text = document.getElementById('resumenText').value;
  if(!text){ alert('Primero presiona "Generar fila para copiar".'); return; }
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

renderAll();
</script>
